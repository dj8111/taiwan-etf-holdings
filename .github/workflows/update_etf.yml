name: 自動更新台股 ETF 持股明細與每日淨值資料庫

on:
  schedule:
    # 台灣時間 (UTC+8) 週一至週五 18:30 執行 (UTC 10:30)
    # 全市場極限模式：每日自動更新全市場 364 檔 ETF 淨值 + 全市場 364 檔持股
    - cron: '30 10 * * 1-5'
  
  workflow_dispatch:
    inputs:
      target_mode:
        description: '持股抓取模式 (all: 全市場 364 檔極限模式 / popular: 核心熱門款)'
        required: true
        default: 'all'
        type: choice
        options:
          - 'all'
          - 'popular'

permissions:
  contents: write

jobs:
  update-all-market-etfs:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: 檢出專案程式碼 (Checkout)
        uses: actions/checkout@v4

      - name: 設定 Python 環境 (Python 3.12)
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: 安裝相依套件
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 執行全市場極限更新 (364 檔每日淨值 + 364 檔持股明細)
        run: |
          if [ "${{ inputs.target_mode }}" = "popular" ]; then
            echo "抓取市場核心主流款 ETF..."
            python main.py fetch-nav
            python main.py fetch 0050 0056 00878 00919 00929 006208 00713 00939 00940 00692 0052 00915 00918 00934 00936
          else
            echo "啟動【全市場極限模式】：抓取全台灣 364 檔 ETF 每日淨值與全體持股..."
            python main.py fetch-all --delay 0.8
          fi

      - name: 匯出最新 CSV 報表 (持股歷史與每日淨值歷史)
        run: |
          python main.py export --dir data

      - name: 顯示更新後成果摘要
        run: |
          python main.py list

      - name: 自動 Commit 並 Push 回 GitHub 儲存庫
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          
          git add etf_data.db data/
          
          if git diff --staged --quiet; then
            echo "今日資料無變更，跳過 Commit。"
          else
            TODAY=$(date '+%Y-%m-%d')
            git commit -m "chore(data): 【全市場自動更新】同步 364 檔 ETF 每日淨值與持股 [${TODAY}]"
            git push
          fi
