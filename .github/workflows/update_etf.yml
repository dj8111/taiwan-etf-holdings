name: 自動更新台股 ETF 持股明細與每日淨值資料庫

on:
  schedule:
    # 台灣時間 (UTC+8) 週一至週五 18:30 執行 (UTC 10:30)
    # 此時當日台股收盤，證交所與各大投信已完成當日淨值與 PCF 揭露
    - cron: '30 10 * * 1-5'
  
  workflow_dispatch:
    inputs:
      target_mode:
        description: '持股抓取模式 (popular: 核心熱門款 / all: 全市場)'
        required: true
        default: 'popular'
        type: choice
        options:
          - 'popular'
          - 'all'

permissions:
  contents: write

jobs:
  update-holdings-and-nav:
    runs-on: ubuntu-latest

    steps:
      - name: 檢出專案程式碼 (Checkout)
        uses: actions/checkout@v4

      - name: 設定 Python 環境 (Python 3.12)
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: 安裝相依套件
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 同步全市場 360+ 檔 ETF 當日每單位淨值與折溢價
        run: |
          python main.py fetch-nav

      - name: 執行 ETF 持股明細更新
        run: |
          if [ "${{ inputs.target_mode }}" = "all" ]; then
            echo "開始抓取全市場所有 ETF 持股..."
            python main.py fetch-all --delay 1.0
          else
            echo "抓取市場核心主流 ETF 持股..."
            python main.py fetch 0050 0056 00878 00919 00929 006208 00713 00939 00940 00692 0052 00915 00934 00936
          fi

      - name: 匯出最新 CSV 報表 (持股與每日淨值歷史)
        run: |
          python main.py export --dir data

      - name: 顯示更新後成果摘要
        run: |
          python main.py list

      - name: 自動 Commit 並 Push 回 GitHub 儲存庫
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          
          git add etf_data.db data/
          
          if git diff --staged --quiet; then
            echo "今日資料無變更，跳過 Commit。"
          else
            TODAY=$(date '+%Y-%m-%d')
            git commit -m "chore(data): 自動更新 ETF 持股與每日淨值 [${TODAY}]"
            git push
          fi
